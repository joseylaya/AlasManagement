services:
  php:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Manila
      APP_URL: https://www.jmgaming.site
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      LOG_LEVEL: warning
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      # Kept outside this repository: this existing file contains the DB admin
      # Basic Auth credentials used by the production reverse proxy.
      - ../docker/nginx/conf.d/.dbadmin.htpasswd:/etc/nginx/secrets/dbadmin.htpasswd:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
