services:
  php:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

  scheduler:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot

networks:
  app-network:
    driver: bridge

volumes:
  certbot-etc:
  certbot-var:
