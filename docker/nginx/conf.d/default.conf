server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 _;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 32m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_upstream php:9000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker Desktop does not reliably follow a host-created public/storage
    # symlink. Serve Laravel's public disk directly instead.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # A stale worker can retain old Laravel/Livewire page snapshots and cause
    # 419 "page expired" prompts. Always revalidate it on each app launch.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
