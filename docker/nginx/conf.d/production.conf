server {
    listen 80;
    listen [::]:80;
    server_name jmgaming.site www.jmgaming.site;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 32m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_upstream php:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The DB browser is intentionally public-facing for authorised operators,
    # but must always challenge before a PHP request can reach it.
    location = /dbadmin.php {
        auth_basic "ALAS DB Admin";
        auth_basic_user_file /etc/nginx/secrets/dbadmin.htpasswd;

        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        # Cloudflare terminates TLS before the HTTP origin connection. Preserve
        # the original scheme so Laravel and Livewire generate HTTPS URLs.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
    }

    location ~ /\. {
        deny all;
    }
}
